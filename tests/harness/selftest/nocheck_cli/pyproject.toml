[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nochecktool"
version = "1.0.0"
description = "Minimaler Kurskatalog für den UX-Gate-Selbsttest"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nochecktool = "nochecktool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
