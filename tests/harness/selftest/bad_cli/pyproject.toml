[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "badtool"
version = "1.0.0"
description = "Absichtlich fehlerhafter Kurskatalog für den UX-Gate-Selbsttest"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
badtool = "badtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
